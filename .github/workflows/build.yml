name: Build Android APK (32-bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK for armeabi-v7a
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show repository tree (диагностика)
        run: |
          echo "=== PWD ==="
          pwd
          ls -la
          find . -maxdepth 3 -name "buildozer.spec" | sort

      - name: Verify buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ОШИБКА: buildozer.spec не найден в корне репозитория!"
            exit 1
          fi
          echo "OK: buildozer.spec найден."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer cython==0.29.36

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer
        working-directory: ${{ github.workspace }}
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-watcher-apk-32bit
          path: bin/*.apk
          if-no-files-found: error
